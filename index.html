<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>连锁药房采购工作台</title>
<style>
  :root{
    --bg:#f4f6fa; --panel:#ffffff; --ink:#1f2733; --muted:#6b7686;
    --line:#e6eaf0; --brand:#2f6fed; --brand-soft:#eaf1ff;
    --red:#e34c4c; --green:#1bab6e; --amber:#e8920c; --blue:#2f6fed;
    --shadow:0 1px 3px rgba(20,40,80,.08),0 6px 18px rgba(20,40,80,.05);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",Segoe UI,sans-serif;background:var(--bg);color:var(--ink);font-size:14px}
  .app{display:flex;min-height:100vh}
  /* sidebar */
  .sidebar{width:210px;background:#1f2a3a;color:#cdd6e4;flex:0 0 auto;padding:18px 0;position:sticky;top:0;height:100vh;overflow:auto}
  .brand{padding:0 18px 16px;font-size:16px;font-weight:700;color:#fff;line-height:1.4}
  .brand small{display:block;font-size:11px;color:#8b97a8;font-weight:400;margin-top:4px}
  .nav{margin-top:8px}
  .nav .nav-item{display:flex;align-items:center;gap:10px;padding:10px 18px;color:#b8c2d0;cursor:pointer;border-left:3px solid transparent;font-size:13.5px;background:transparent;border:none;width:100%;text-align:left;font-family:inherit}
  .nav .nav-item:hover{background:#27384d;color:#fff}
  .nav .nav-item.active{background:#27384d;color:#fff;border-left-color:var(--brand)}
  .nav .ico{width:18px;text-align:center}
  .nav .badge{margin-left:auto;background:var(--red);color:#fff;border-radius:10px;font-size:11px;padding:1px 7px;display:none}
  .nav .badge.show{display:inline-block}
  /* main */
  .main{flex:1;display:flex;flex-direction:column;min-width:0}
.topbar{padding:16px 24px;background:var(--panel);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;flex-wrap:nowrap;gap:16px}
.topbar h1{font-size:18px;font-weight:700;white-space:nowrap}
.topbar .date{color:var(--muted);font-size:13px;white-space:nowrap}
.topbar .actions{display:flex;gap:8px;flex-wrap:nowrap;align-items:center}
.btn{background:var(--brand);color:#fff;border:none;padding:8px 14px;border-radius:8px;cursor:pointer;font-size:13px;font-weight:600;white-space:nowrap;flex-shrink:0}
  .btn:hover{background:#2560d8}
  .btn.ghost{background:var(--brand-soft);color:var(--brand)}
  .btn.ghost:hover{background:#dbe7ff}
  .btn.mini{padding:4px 9px;font-size:12px;border-radius:6px}
  .btn.danger{background:#fff;color:var(--red);border:1px solid #f2c4c4}
  .btn.danger:hover{background:#fff5f5}
  .content{padding:22px 24px;overflow:auto;flex:1}
  .view{display:none}
  .view.active{display:block}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px;box-shadow:var(--shadow)}
  .card h2{font-size:15px;margin-bottom:14px;display:flex;align-items:center;gap:8px}
  .grid{display:grid;gap:14px}
  .grid.cols-4{grid-template-columns:repeat(4,1fr)}
  .grid.cols-3{grid-template-columns:repeat(3,1fr)}
  .grid.cols-2{grid-template-columns:repeat(2,1fr)}
  @media(max-width:880px){.grid.cols-4,.grid.cols-3,.grid.cols-2{grid-template-columns:1fr}}
  .stat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;box-shadow:var(--shadow)}
  .stat .label{color:var(--muted);font-size:12px}
  .stat .num{font-size:26px;font-weight:700;margin-top:6px}
  .stat .sub{font-size:12px;color:var(--muted);margin-top:4px}
  .alert{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-radius:10px;border:1px solid;margin-bottom:10px}
  .alert.warn{background:#fff8ec;border-color:#f6dca6}
  .alert.info{background:var(--brand-soft);border-color:#cfe0ff}
  .alert.ok{background:#eafaf2;border-color:#bdebd2}
  .alert .dot{width:10px;height:10px;border-radius:50%;margin-top:4px;flex:0 0 auto}
  .alert.warn .dot{background:var(--amber)}
  .alert.info .dot{background:var(--blue)}
  .alert.ok .dot{background:var(--green)}
  .alert .txt{font-size:13px;line-height:1.5}
  .alert .txt b{display:block;margin-bottom:2px}
  /* table */
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line)}
  th{color:var(--muted);font-weight:600;background:#fafbfd;font-size:12.5px}
  tr:hover td{background:#fafcff}
  td .tag{display:inline-block;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:600}
  .tag.cyan{background:#e6f4ff;color:#1f74c4}
  .tag.grey{background:#eef1f5;color:#6b7686}
  .tag.green{background:#e6f7ef;color:#1bab6e}
  .tag.amber{background:#fff3e0;color:#d97a08}
  .tag.red{background:#fdeaea;color:#e34c4c}
  .tag.blue{background:#eaf1ff;color:#2f6fed}
  /* form */
  .form-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
  .form-grid .full{grid-column:1/-1}
  label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px}
  input,select,textarea{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:8px;font-size:13px;font-family:inherit;background:#fff;color:var(--ink)}
  textarea{resize:vertical;min-height:60px}
  .modal-bg{position:fixed;inset:0;background:rgba(15,23,42,.45);display:none;align-items:center;justify-content:center;z-index:50}
  .modal-bg.show{display:flex}
  .modal{background:#fff;border-radius:14px;width:min(560px,92vw);max-height:88vh;overflow:auto;padding:22px}
  .modal-card{max-width:560px}
  .modal-title{font-size:16px;font-weight:700;margin-bottom:12px}
  .modal-note{font-size:13px;line-height:1.7;color:var(--ink);background:var(--brand-soft);border-radius:10px;padding:12px 14px;margin-bottom:4px}
  .modal-note b{color:var(--brand)}
  .modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:8px}
  .modal h3{margin-bottom:16px;font-size:16px}
  .modal .form-grid{margin-bottom:14px}
  .modal .foot{display:flex;justify-content:flex-end;gap:10px;margin-top:6px}
  .row-actions{display:flex;gap:6px}
  .empty{padding:30px;text-align:center;color:var(--muted)}
  .toolbar{display:flex;gap:10px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
  .toolbar .spacer{flex:1}
  .hidden{display:none}
  .pill{font-size:11px;padding:2px 8px;border-radius:20px;font-weight:600}
  .pill.r{background:#fdeaea;color:#e34c4c}
  .pill.g{background:#e6f7ef;color:#1bab6e}
  .pill.a{background:#fff3e0;color:#d97a08}
  .section-note{color:var(--muted);font-size:12px;margin-bottom:14px;line-height:1.6}
  .kv{display:flex;gap:6px;font-size:13px;margin:3px 0}
  .kv .k{color:var(--muted);min-width:64px}
</style>
</head>
<body>
<div class="app">
  <div class="sidebar">
    <div class="brand">📦 采购工作台<small>连锁药房 · 总部采购</small></div>
    <div class="nav" id="nav"></div>
  </div>
  <div class="main">
    <div class="topbar">
      <div>
        <h1 id="viewTitle">概览</h1>
        <div class="date" id="todayDate"></div>
      </div>
      <div class="actions">
        <button class="btn ghost" onclick="exportData()">导出数据</button>
        <button class="btn ghost" onclick="importData()">导入数据</button>
        <button class="btn ghost" onclick="refresh()">🔄 刷新数据</button>
        <button class="btn" onclick="openModal('add')">+ 快速新增</button>
      </div>
    </div>
    <div class="content" id="content"></div>
  </div>
</div>

<div class="modal-bg" id="modalBg">
  <div class="modal" id="modal"></div>
</div>
<input type="file" id="fileInput" accept="application/json" style="display:none">

<!-- 云端版无需浏览器端解析 Excel，故不加载 xlsx 库 -->
<script>
/* ============ 数据层 ============ */
const MANUAL_KEY = "pharmacy_manual_v1"; // 仅存本机手动录入，云端 Excel 数据来自 data.json
const today = new Date();
const ym = today.getFullYear()+"-"+String(today.getMonth()+1).padStart(2,"0");
// 旧示例数据的供应商短ID → 全称（兼容历史数据，repairDB/supName 均会用到，须在数据层定义）
const SEED_SUP = {"s1":"上海九州通医药有限公司","s2":"国药控股股份有限公司","s3":"上药铃谦沪中(上海)医药有限公司","s4":"上药控股有限公司","s5":"国药控股分销中心有限公司","s6":"河北泽运生物医药科技有限公司","s7":"无锡市凯奥善生物医药科技有限公司","s8":"华润医药商业集团上海医药有限公司","s9":"山东滕州康神医药有限公司","s10":"江苏钤印留白中医文化发展有限公司","s11":"上药康德乐罗达(上海)医药有限公司"};

function loadManual(){ try{ return JSON.parse(localStorage.getItem(MANUAL_KEY)||"{}"); }catch(e){ return {}; } }
function saveManual(){
  const m = {
    plans: DB.plans||[], returns: DB.returns||[], flows: DB.flows||[],
    feedback: DB.feedback||[], followups: DB.followups||[],
    orderEdits: DB.orderEdits||{}, menuConfig: DB.menuConfig||{}
  };
  try{ localStorage.setItem(MANUAL_KEY, JSON.stringify(m)); }catch(e){ console.warn("手动数据保存失败", e); }
}
function save(){ saveManual(); } // 云端版：Excel 数据来自 data.json，不落本机

function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,6); }
function repairDB(){ // 修复旧 localStorage 中的 Excel 序列号日期、原始状态等
  DB.followups = DB.followups||[]; // 沟通记录（新字段，兼容旧数据）
  DB.inbound = DB.inbound||[];     // 采购入库记录（以采购入库表为准）
  (DB.inbound||[]).forEach(r=>{ if(r.date) r.date=excelDateToISO(r.date); if(r.orderDate) r.orderDate=excelDateToISO(r.orderDate); });
  // 供应商 ID 归一化：旧示例数据短ID(s1..s11) → 同步后的全称ID(s_名称)，避免显示成 s1/s2
  (function(){
    const name2id={}; DB.suppliers.forEach(s=>{ name2id[s.name]=s.id; });
    if(Object.keys(name2id).length){
      ["orders","recon","payments","returns","plans","flows","feedback"].forEach(k=>{
        (DB[k]||[]).forEach(r=>{
          if(r.supplierId && SEED_SUP[r.supplierId] && !DB.suppliers.some(s=>s.id===r.supplierId)){
            const nid=name2id[SEED_SUP[r.supplierId]];
            if(nid) r.supplierId=nid;
          }
        });
      });
    }
  })();
  // 清理 SheetJS 读入的空行（旧数据中可能残留）
  DB.recon = (DB.recon||[]).filter(r=> String(r.supplierId||r.invoiceAmount||r.invoiceNo||"").trim() );
  DB.orders = (DB.orders||[]).filter(o=> String(o.supplierId||o.orderNo||o.product||"").trim() );
  DB.ticketDetail = (DB.ticketDetail||[]).filter(t=> String(t.supplierId||t.party||t.product||t.amount||"").trim() );
  // 催收只保留「票折催收初步录入」的记录：派生记录特征为 status="待催收" 且 seq 为空
  DB.ticketDunning = (DB.ticketDunning||[]).filter(t=> String(t.supplierId||t.product||t.est||t.owed||"").trim() && !(t.status==="待催收" && !t.seq) );
  (DB.recon||[]).forEach(r=>{ if(r.payDue) r.payDue=excelDateToISO(r.payDue); });
  (DB.orders||[]).forEach(o=>{
    if(o.expectDate) o.expectDate=excelDateToISO(o.expectDate);
    if(o.orderDate) o.orderDate=excelDateToISO(o.orderDate);
    // 入库金额：优先用同步的「入库金额」列；旧数据缺失时按 单价×已入库数量 补算
    if(!o.inAmount){
      const inQty=parseFloat(o.inQty)||0, price=parseFloat(o.price)||0;
      o.inAmount = inQty>0&&price>0 ? Math.round(inQty*price*100)/100 : "";
    }
    const raw=String(o.status||"").trim();
    if(raw==="未到齐"||raw==="逾期未到"||raw==="在途"||raw==="部分到货") o.status="在途";
    else if(raw==="未发货"||raw==="未发") o.status="待发货";
    else if(raw==="已到齐"||raw==="已入库") o.status="已入库";
  });
  (DB.ticketDunning||[]).forEach(t=>{
    if(t.firstDate) t.firstDate=excelDateToISO(t.firstDate);
    if(t.lastDate) t.lastDate=excelDateToISO(t.lastDate);
    if(t.nextDate) t.nextDate=excelDateToISO(t.nextDate);
  });
  (DB.ticketDetail||[]).forEach(t=>{ if(t.date) t.date=excelDateToISO(t.date); });
  (DB.payments||[]).forEach(p=>{ if(p.payDate) p.payDate=excelDateToISO(p.payDate); });
}
let DB = { suppliers:[], orders:[], recon:[], payments:[], ticketDetail:[], ticketDunning:[], inbound:[], plans:[], returns:[], flows:[], feedback:[], followups:[], orderEdits:{} };
async function boot(silent){
  try{
    const r = await fetch('./data.json?_=' + Date.now(), {cache:'no-store'});
    if(r.ok){
      const data = await r.json();
      DB.suppliers=data.suppliers||[]; DB.orders=data.orders||[]; DB.recon=data.recon||[];
      DB.payments=data.payments||[]; DB.ticketDetail=data.ticketDetail||[]; DB.ticketDunning=data.ticketDunning||[]; DB.inbound=data.inbound||[];
      DB.meta=data.meta||{};
    } else if(!silent){ alert('数据加载失败（HTTP '+r.status+'）'); }
  }catch(e){ if(!silent) alert('无法连接数据（可能离线）：'+e.message); }
  const m = loadManual();
  DB.plans=m.plans||[]; DB.returns=m.returns||[]; DB.flows=m.flows||[]; DB.feedback=m.feedback||[]; DB.followups=m.followups||[]; DB.menuConfig=m.menuConfig||{};
  DB.orderEdits=m.orderEdits||{};
  // 应用本机跟单备注/状态覆盖（按订单 id）
  Object.keys(DB.orderEdits).forEach(id=>{ const o=DB.orders.find(x=>x.id===id); if(o) Object.assign(o, DB.orderEdits[id]); });
  repairDB();
  renderNav(); showView("dash");
}

    {id:"s7",name:"康恩贝",short:"康恩贝",contact:"周经理",phone:" 138-0000-1007",category:"中成药",terms:"月结30天",note:""},
    {id:"s8",name:"以岭药业",short:"以岭",contact:"孙经理",phone:"138-0000-1008",category:"中成药",terms:"月结30天",note:"连花清瘟核心供应商"},

    {id:"s10",name:"鱼跃医疗",short:"鱼跃",contact:"郑经理",phone:"138-0000-1010",category:"医疗器械",terms:"月结30天",note:""}
  ];
  const plans = [
    {id:uid(),month:ym,supplierId:"s1",product:"阿莫西林胶囊",qty:1200,planDate:ym+"-05",note:"门店常规补货",status:"已确认"},
    {id:uid(),month:ym,supplierId:"s8",product:"连花清瘟胶囊",qty:800,planDate:ym+"-06",note:"流感季备货",status:"待审批"},

  ];
  const orders = [

    {id:uid(),orderNo:"PO-"+ym+"-003",supplierId:"s6",product:"黄芪饮片",qty:200,price:38,amount:7600,orderDate:ym+"-10",expectDate:ym+"-18",status:"待发货",track:"已下单，等待厂家排产"}
  ];
  const recon = [
    {id:uid(),supplierId:"s1",month:ym,invoiceAmount:6240,receiptAmount:6240,diff:0,status:"已平账",note:"账实相符"},
    {id:uid(),supplierId:"s8",month:ym,invoiceAmount:9200,receiptAmount:9000,diff:200,status:"差异处理中",note:"到货短少，待厂家补货"}
  ];
  const payments = [
    {id:uid(),supplierId:"s1",amount:6240,payDate:ym+"-15",method:"电汇",reconId:"",note:"月结付清"}

  const returns = [
    {id:uid(),certNo:"RT-"+ym+"-001",storeId:"门店A",supplierId:"s8",product:"连花清瘟胶囊",qty:40,reason:"近效期",certDate:ym+"-15",status:"已开具"},
    {id:uid(),certNo:"RT-"+ym+"-002",storeId:"门店B",supplierId:"s3",product:"感冒灵颗粒",qty:25,reason:"包装破损",certDate:ym+"-16",status:"待开具"}
  ];
  const flows = [
    {id:uid(),month:ym,product:"连花清瘟胶囊",manufacturer:"以岭药业",qty:760,exportDate:ym+"-03",status:"已导出"},
    {id:uid(),month:ym,product:"阿莫西林胶囊",manufacturer:"九州通医药",qty:1200,exportDate:ym+"-03",status:"已导出"}
  ];
  const feedback = [
    {id:uid(),date:ym+"-20",storeId:"门店A",type:"缺货",content:"氨溴索口服液连续三天断货",status:"处理中",handler:"我",reply:"已向九州通加急补单"},

const supName = id => {
  if(!id) return "—";
  if(typeof id==="string" && id.startsWith("raw_")) return id.slice(4);
  const s=DB.suppliers.find(x=>x.id===id);
  if(s) return s.name;
  if(SEED_SUP[id]) return SEED_SUP[id]; // 兼容旧数据短ID
  return id || "—";
};
const fmt = n => (typeof n==="number"? n.toLocaleString("zh-CN"):n);
const money = n => "¥"+fmt(Math.round(n*100)/100);
function dayOfMonth(){ return today.getDate(); }
function excelDateToISO(v){ // 统一把 Excel 序列号 / Date 对象 / 各种日期字符串转成 YYYY-MM-DD
  if(!v) return "";
  if(v instanceof Date) return v.toISOString().slice(0,10);
  if(typeof v==="number"){
    const n=v;
    if(n>25569 && n<100000) return new Date((n-25569)*86400000).toISOString().slice(0,10);
  }
  const s=String(v).trim();
  if(!s) return "";
  if(/^\d{4}[-/]\d{2}[-/]\d{2}$/.test(s)) return s.replace(/\//g,"-");
  const n=parseFloat(s);
  if(!isNaN(n) && n>25569 && n<100000) return new Date((n-25569)*86400000).toISOString().slice(0,10);
  const d=new Date(s);
  if(!isNaN(d)) return d.toISOString().slice(0,10);
  return s;
}
function daysBetween(target){ // 距今天数（负数=已过期）
  if(!target) return null;
  const iso=excelDateToISO(target);
  if(!iso) return null;
  const t=new Date(iso);
  if(isNaN(t)) return null;
  return Math.round((t - today)/86400000);
}
function nextBadge(date){
  const dd=daysBetween(date);
  if(dd===null) return `<span class="pill g">—</span>`;
  if(dd<0) return `<span class="pill r">逾期 ${-dd}天</span>`;
  if(dd<=7) return `<span class="pill a">${dd}天后</span>`;
  return `<span class="pill g">${dd}天后</span>`;
}
function dueSoon(term){
  // 简化：月结30天则次月对应日付款；这里按月初/月末粗略判断
  return term;
}
function fmtDate(v){ return excelDateToISO(v)||"—"; }

  {id:"return",label:"退货证明",ico:"↩️"},
  {id:"flow",label:"品种流向",ico:"📤"},
  {id:"ticket",label:"票折管理",ico:"🎫"},
  {id:"followup",label:"沟通记录",ico:"💬"},
  {id:"feedback",label:"门店反馈",ico:"📣"}
];

function navItems(){ // 根据自定义配置过滤可见项
  return NAV.filter(n=> !(DB.menuConfig && DB.menuConfig[n.id] && DB.menuConfig[n.id].visible===false));
}
function navLabel(id){
  const def = NAV.find(n=>n.id===id);
  const cfg = DB.menuConfig && DB.menuConfig[id];
  return (cfg && cfg.label) || (def && def.label) || id;
}
function renderNav(){
  const nav = document.getElementById("nav");
  nav.innerHTML = navItems().map(n=>{
    const badge = badgeFor(n.id);
    return `<button class="nav-item ${n.id==='dash'?'active':''}" data-view="${n.id}"><span class="ico">${n.ico}</span>${navLabel(n.id)}${badge?`<span class="badge show">${badge}</span>`:''}</button>`;
  }).join("") +
  `<button class="nav-item gear" onclick="openMenuEdit()"><span class="ico">⚙️</span>自定义菜单</button>`;
  nav.querySelectorAll(".nav-item[data-view]").forEach(a=>{
    a.onclick=()=>{
      nav.querySelectorAll(".nav-item").forEach(x=>x.classList.remove("active"));
      a.classList.add("active");
      showView(a.dataset.view);
    };
  });
}
function openMenuEdit(){
  const items = NAV.map(n=>`<div style="display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)">
    <input type="checkbox" ${DB.menuConfig&&DB.menuConfig[n.id]&&DB.menuConfig[n.id].visible===false?'':'checked'} onchange="menuToggle('${n.id}',this.checked)">
    <span style="width:24px;text-align:center">${n.ico}</span>
    <input id="lbl_${n.id}" value="${navLabel(n.id)}" style="flex:1" placeholder="${n.label}">
    <button class="btn mini" onclick="menuRename('${n.id}')">保存名</button>
  </div>`).join("");
  openModalRaw(`<div class="modal-title">🛠️ 自定义左侧菜单</div>
    <div class="modal-note">勾选控制是否显示；修改名称后点「保存名」。概览不可隐藏。</div>
    ${items}
    <div class="modal-actions"><button class="btn" onclick="closeModal()">完成</button></div>`);
}
function menuToggle(id,checked){
  DB.menuConfig = DB.menuConfig||{};
  DB.menuConfig[id] = DB.menuConfig[id]||{};
  DB.menuConfig[id].visible = checked;
  save(); renderNav();
}
function menuRename(id){
  DB.menuConfig = DB.menuConfig||{};
  DB.menuConfig[id] = DB.menuConfig[id]||{};
  DB.menuConfig[id].label = document.getElementById("lbl_"+id).value.trim()||NAV.find(n=>n.id===id).label;
  save(); renderNav();
}
function badgeFor(id){
  if(id==="return"){ // 每月中旬需要开票
    const d=dayOfMonth();
    if(d>=10&&d<=20){ return DB.returns.filter(r=>r.status==="待开具").length||""; }
    return "";
  }
  if(id==="flow"){
    const d=dayOfMonth();
    if(d<=8){ return DB.flows.filter(f=>f.month===ym&&f.status!=="已导出").length||""; }
    return "";
  }
  if(id==="feedback"){ return DB.feedback.filter(f=>f.status!=="已解决").length||""; }
  if(id==="followup"){ return DB.followups.filter(f=>{const dd=daysBetween(f.nextDate); return f.status!=="已完成"&&dd!==null&&dd<=0;}).length||""; }
  if(id==="order"){ return DB.orders.filter(o=>(o.status==="在途"&&!(o.track&&o.track.trim()))||o.status==="待发货").length||""; }
  return "";
}

/* ============ 视图渲染 ============ */
function showView(id){
  document.getElementById("viewTitle").textContent = navLabel(id);
  const c = document.getElementById("content");
  if(id==="dash") c.innerHTML = viewDash();
  if(id==="supplier") c.innerHTML = viewSupplier();
  if(id==="plan") c.innerHTML = viewPlan();
  if(id==="order") c.innerHTML = viewOrder();
  if(id==="recon") c.innerHTML = viewRecon();
  if(id==="payment") c.innerHTML = viewPayment();
  if(id==="return") c.innerHTML = viewReturn();
  if(id==="flow") c.innerHTML = viewFlow();
  if(id==="ticket") c.innerHTML = viewTicket();
  if(id==="followup") c.innerHTML = viewFollowup();
  if(id==="feedback") c.innerHTML = viewFeedback();
  bindView(id);
}
function bindView(id){
  if(id==="order") filterOrders();
  if(id==="payment") renderPay(document.getElementById("fPay")?document.getElementById("fPay").value:"");
  if(id==="feedback") filterFeedback();
  if(id==="followup") filterFollowups();
  if(id==="ticket") renderTicketTables("","");
}

/* ---- 概览 ---- */
function viewDash(){
  const d=dayOfMonth();
  const unpaid = DB.recon.filter(r=>r.status!=="已平账" && r.payDue);
  const payTotal = unpaid.reduce((a,r)=>a+(parseFloat(r.invoiceAmount)||0),0);
  const overduePay = unpaid.filter(r=>daysBetween(r.payDue)<0).length;
  const soonPay = unpaid.filter(r=>{const dd=daysBetween(r.payDue); return dd!==null&&dd>=0&&dd<=7;}).length;
  const owedRows = DB.ticketDunning.filter(t=>(parseFloat(t.owed)||0)>0);
  const owedTotal = owedRows.reduce((a,t)=>a+(parseFloat(t.owed)||0),0);
  const soonCollect = owedRows.filter(t=>{const dd=daysBetween(t.nextDate); return dd!==null&&dd>=0&&dd<=7;}).length;
  const paidTotal = DB.payments.reduce((a,p)=>a+(parseFloat(p.amount)||0),0);

  const stats = [
    {label:"供应商",num:DB.suppliers.length,sub:"家合作供应商"},
    {label:"待付金额",num:money(payTotal),sub:`${unpaid.length} 笔未付${overduePay?` · <span style="color:var(--red)">${overduePay} 笔逾期</span>`:""}`},
    {label:"已付金额",num:money(paidTotal),sub:`${DB.payments.length} 笔`},
    {label:"待催收票折",num:money(owedTotal),sub:`${owedRows.length} 笔${soonCollect?` · <span style="color:var(--amber)">${soonCollect} 笔待跟进</span>`:""}`}
  ];

  /* ---- 今日待办：自动聚合四类事务 ---- */
  const todos=[];
  unpaid.forEach(r=>{
    const dd=daysBetween(r.payDue);
    if(dd!==null && dd<=7){
      todos.push({view:"payment", cls:dd<0?"r":"a", tag:"付款", title:supName(r.supplierId), val:money(r.invoiceAmount), date:fmtDate(r.payDue), dd});
    }
  });
  owedRows.forEach(t=>{
    const dd=daysBetween(t.nextDate);
    if(dd!==null && dd<=7){
      todos.push({view:"ticket", cls:dd<0?"r":"a", tag:"票折催收", title:(supName(t.supplierId)||t.supplierId)+(t.product?" · "+t.product:""), val:money(parseFloat(t.owed)||0), date:fmtDate(t.nextDate), dd});
    }
  });
  DB.orders.forEach(o=>{
    if((o.status==="在途"&&!(o.track&&o.track.trim()))||o.status==="待发货"){
      todos.push({view:"order", cls:"b", tag:"到货跟进", title:o.product, val:o.orderNo||"", date:o.expectDate?fmtDate(o.expectDate):"—", dd:null});
    }
  });
  DB.followups.forEach(f=>{
    if(f.status!=="已完成"){
      const dd=daysBetween(f.nextDate);
      if(dd!==null && dd<=1){
        todos.push({view:"followup", cls:dd<0?"r":"a", tag:"沟通跟进", title:(f.target||"")+(f.topic?" · "+f.topic:""), val:"", date:fmtDate(f.nextDate), dd});
      }
    }
  });
  todos.sort((a,b)=>(a.dd===null?999:a.dd)-(b.dd===null?999:b.dd));

  let html = `<div class="grid cols-4" style="margin-bottom:16px">
    ${stats.map(s=>`<div class="stat"><div class="label">${s.label}</div><div class="num">${s.num}</div><div class="sub">${s.sub}</div></div>`).join("")}
  </div>`;

  html += `<div class="card"><h2>📌 今日待办</h2>`;
  html += `<div class="section-note">系统自动聚合：7 天内到期的付款、待催收的票折、在途未到齐的订单、该跟进的沟通。点击行可跳转详情。</div>`;
  if(todos.length){
    html += `<table><thead><tr><th>待办</th><th>内容</th><th>金额/单号</th><th>日期</th><th>状态</th></tr></thead><tbody>`;
    const shown=todos.slice(0,12);
    shown.forEach(t=>{
      let pill;
      if(t.dd===null) pill=`<span class="pill g">待跟进</span>`;
      else if(t.dd<0) pill=`<span class="pill r">逾期 ${-t.dd}天</span>`;
      else if(t.dd===0) pill=`<span class="pill a">今天</span>`;
      else pill=`<span class="pill a">${t.dd}天后</span>`;
      const tagCls={pay:"tag red",collect:"tag amber",order:"tag blue",follow:"tag cyan"}[t.tag]||"tag grey";
      html += `<tr style="cursor:pointer" onclick="showView('${t.view}')">
        <td><span class="${tagCls}">${t.tag}</span></td>
        <td>${t.title}</td><td>${t.val||"—"}</td><td>${t.date}</td><td>${pill}</td></tr>`;
    });
    if(todos.length>shown.length) html += `<tr><td colspan="5" class="empty">还有 ${todos.length-shown.length} 项，去对应模块查看全部</td></tr>`;
    html += `</tbody></table>`;
  } else {
    html += `<div class="alert ok"><span class="dot"></span><div class="txt"><b>今日无紧急待办</b>付款、催收、到货都正常，可以安心做事。</div></div>`;
  }
  html += `</div>`;

  // 月度例行提醒
  const alerts=[];
  if(d>=10&&d<=20){
    alerts.push({cls:"warn",title:"每月中旬｜开具退货证明",body:"处于开票窗口期（10–20 日），请及时为门店开具本月退货证明。"});
  } else {
    const daysTo = 10-d;
    alerts.push({cls:"info",title:"退货证明提醒",body: daysTo>0?`每月中旬(10–20日)需为门店开具退货证明，还有约 ${daysTo} 天。` : `本月已过窗口期，请确认退货证明是否已全部开具。`});
  }
  const inTransit = DB.orders.filter(o=>(o.status==="在途"&&!(o.track&&o.track.trim()))||o.status==="待发货").length;
  const openFollow = DB.followups.filter(f=>f.status!=="已完成").length;
  html += `<div class="card" style="margin-top:16px"><h2>📅 月度与状态速览</h2>`;
  html += alerts.map(a=>`<div class="alert ${a.cls}"><span class="dot"></span><div class="txt"><b>${a.title}</b>${a.body}</div></div>`).join("");
  html += `<div class="grid cols-3" style="margin-top:12px">
    <div class="stat"><div class="label">在途待跟进</div><div class="num">${inTransit}</div><div class="sub">笔订单需要关注到货</div></div>
    <div class="stat"><div class="label">进行中沟通</div><div class="num">${openFollow}</div><div class="sub">条待跟进沟通</div></div>
    <div class="stat"><div class="label">今日日期</div><div class="num" style="font-size:15px">${ym.replace("-","/")}</div><div class="sub">${today.toLocaleDateString("zh-CN",{weekday:"long"})}</div></div>
  </div>`;
  html += `</div>`;
  return html;
}

function statusTag(s){
  const map={};
  map["已入库"]="tag green";map["在途"]="tag blue";map["待发货"]="tag amber";map["已平账"]="tag green";
  map["差异处理中"]="tag red";map["已开具"]="tag green";map["待开具"]="tag amber";map["已导出"]="tag green";
  map["已确认"]="tag green";map["待审批"]="tag amber";
  return `<span class="${map[s]||'tag grey'}">${s}</span>`;
}

/* ---- 供应商 ---- */
function nameMatch(a,b){ // 供应商名称模糊匹配：去括号后互相包含，长度门槛≥5
  if(!a||!b) return false;
  const x=String(a).replace(/[()（）]/g,""), y=String(b).replace(/[()（）]/g,"");
  if(x===y) return true;
  if(x.length<5||y.length<5) return false;
  return x.indexOf(y)>=0 || y.indexOf(x)>=0;
}
function supplierMonthPurchase(sid, month){ // 某供应商某月(默认当月)的采购金额：优先用「采购入库表」，否则退回订单入库金额
  const m=month||ym;
  const s=DB.suppliers.find(x=>x.id===sid);
  const sName=s?s.name:"";
  let total=0, rows=0;
  if(DB.inbound && DB.inbound.length){
    DB.inbound.forEach(r=>{
      if(sName ? !nameMatch(r.supplierName, sName) : r.supplierId!==sid) return;
      if(String(r.date||"").slice(0,7)!==m) return;
      total += parseFloat(r.taxAmount)||parseFloat(r.amount)||0;
      rows++;
    });
    return {total, rows, src:"inbound"};
  }
  (DB.orders||[]).forEach(o=>{
    if(o.supplierId!==sid) return;
    const d=String(o.orderDate||"");
    if(d.slice(0,7)!==m) return;
    total += parseFloat(o.inAmount)||0;
    rows++;
  });
  return {total, rows, src:"order"};
}
function viewSupplier(){
  const monthTotal = DB.suppliers.reduce((a,s)=>a+supplierMonthPurchase(s.id).total,0);
  const monthRows = DB.suppliers.reduce((a,s)=>a+supplierMonthPurchase(s.id).rows,0);
  const useInbound = DB.inbound && DB.inbound.length>0;
  let html = `<div class="section-note">管理你的 ${DB.suppliers.length} 家核心供应商。「本月采购金额」${useInbound?'以你同步的《采购入库表》含税金额为准（最准确）':'按订单实际入库金额统计（同步《采购入库表8月.xlsx》后更准确）'}，按入库日期归属月份。</div>`;
  html += `<div class="grid cols-3" style="margin-bottom:14px">
    <div class="stat"><div class="label">${ym.replace("-","/")} 采购总额</div><div class="num" style="color:var(--red)">${money(monthTotal)}</div><div class="sub">${useInbound?'入库表·含税金额':'订单入库金额'}</div></div>
    <div class="stat"><div class="label">本月入库笔数</div><div class="num">${monthRows}</div><div class="sub">${useInbound?'入库单数':'订单笔数'}</div></div>
    <div class="stat"><div class="label">供应商</div><div class="num">${DB.suppliers.length}</div><div class="sub">家合作供应商</div></div>
  </div>`;
  html += `<div class="toolbar"><button class="btn" onclick="openForm('supplier','add')">+ 新增供应商</button><div class="spacer"></div></div>`;
  html += `<div class="card"><table><thead><tr><th>简称</th><th>全称</th><th>联系人</th><th>电话</th><th>本月采购金额</th><th>经营品类</th><th>结算周期</th><th>操作</th></tr></thead><tbody>`;
  html += DB.suppliers.map(s=>{
    const p=supplierMonthPurchase(s.id);
    return `<tr>
    <td><b>${s.short}</b></td><td>${s.name}</td><td>${s.contact}</td><td>${s.phone}</td>
    <td><b style="color:var(--red)">${money(p.total)}</b>${p.rows?`<div style="font-size:11px;color:var(--muted)">${p.rows} 笔</div>`:''}</td>
    <td><span class="tag cyan">${s.category}</span></td><td>${s.terms}</td>
    <td class="row-actions"><button class="btn ghost mini" onclick="openForm('supplier','edit','${s.id}')">编辑</button>
    <button class="btn danger mini" onclick="del('supplier','${s.id}')">删除</button></td></tr>`;
  }).join("");
  html += `</tbody></table></div>`;
  return html;
}

    </select></div>`;

function filterOrders(){
  const f=document.getElementById("fStatus").value;
  const kw=((document.getElementById("fOrderKw")||{}).value||"").trim().toLowerCase();
  const tb=document.querySelector("#orderTable tbody");
  const rows=DB.orders.filter(o=>{
    if(f && o.status!==f) return false;
    if(f==="在途" && (o.track&&o.track.trim())) return false; // 有跟单备注视为已完结
    if(kw){
      const sup=supName(o.supplierId)||"";
      const hay=(o.product+" "+o.orderNo+" "+sup+" "+o.spec).toLowerCase();
      if(hay.indexOf(kw)<0) return false;
    }
    return true;
  });
  tb.innerHTML = rows.length? rows.map(o=>{
    const overdue = o.status!=="已入库" && new Date(o.expectDate)<today;
    return `<tr ${overdue?'style="background:#fff5f5"':''}>
      <td>${o.orderNo}</td><td>${supName(o.supplierId)}</td><td>${o.store}</td>
      <td>${o.product}</td><td>${o.qty}</td><td>${o.price}</td><td>${money(o.amount)}</td>
      <td>${o.expectDate}${overdue?' <span class="pill r">逾期</span>':''}</td>
      <td>${statusTag(o.status)}</td><td style="color:#6b7686;font-size:12px">${o.track||"—"}</td>
      <td class="row-actions"><button class="btn ghost mini" onclick="trackOrder('${o.id}')">跟单</button>
      <button class="btn danger mini" onclick="del('order','${o.id}')">删除</button></td></tr>`;
  }).join("") : `<tr><td colspan="11" class="empty">暂无订单</td></tr>`;
}

/* ---- 付款 ---- */
function viewPayment(){
  const invoices = DB.recon.filter(r=>r.payDue);
  const unpaid = invoices.filter(r=>r.status!=="已平账");
  const totalUnpaid = unpaid.reduce((a,r)=>a+(parseFloat(r.invoiceAmount)||0),0);
  const overdue = unpaid.filter(r=>daysBetween(r.payDue)<0).length;
  const soon = unpaid.filter(r=>{const dd=daysBetween(r.payDue); return dd!==null&&dd>=0&&dd<=7;}).length;
  let html = `<div class="section-note">按「发票登记与付款」里的付款到期日，展示每家供应商应付时间与金额；距离到期 7 天内或已逾期会标红/标黄提醒，方便提前做付款计划。</div>`;
  html += `<div class="grid cols-3" style="margin-bottom:14px">
    <div class="stat"><div class="label">待付总额</div><div class="num" style="color:var(--red)">${money(totalUnpaid)}</div></div>
    <div class="stat"><div class="label">7天内 / 逾期</div><div class="num">${soon} 笔 / <span style="color:var(--red)">${overdue} 笔</span></div></div>
    <div class="stat"><div class="label">已登记付款</div><div class="num">${DB.payments.length} 笔</div></div>
  </div>`;
  html += `<div class="toolbar"><button class="btn" onclick="openForm('payment','add')">+ 登记一笔付款</button><div class="spacer"></div>
    <input id="fPayKw" placeholder="🔍 筛选供应商/发票号" oninput="renderPay(document.getElementById('fPay').value)" style="max-width:200px">
    <select id="fPay" onchange="renderPay(this.value)" style="width:170px"><option value="">全部</option><option value="upcoming">待付·未到期</option><option value="soon">7天内/逾期</option><option value="paid">已付</option></select></div>`;
  html += `<div class="card"><table id="payTable"><thead><tr><th>供应商</th><th>应付金额</th><th>付款到期日</th><th>剩余天数</th><th>状态</th><th>备注</th></tr></thead><tbody></tbody></table></div>`;
  return html;
}
function renderPay(filter){
  const tb=document.querySelector("#payTable tbody");
  if(!tb) return;
  const kw=((document.getElementById("fPayKw")||{}).value||"").trim().toLowerCase();
  let rows = DB.recon.filter(r=>r.payDue);
  if(kw){
    rows=rows.filter(r=>{
      const hay=(supName(r.supplierId)+" "+r.invoiceNo+" "+(r.note||"")).toLowerCase();
      return hay.indexOf(kw)>=0;
    });
  }
  if(filter==="upcoming") rows=rows.filter(r=>r.status!=="已平账"&&daysBetween(r.payDue)>0);
  else if(filter==="soon") rows=rows.filter(r=>r.status!=="已平账"&&daysBetween(r.payDue)<=7);
  else if(filter==="paid") rows=rows.filter(r=>r.status==="已平账");
  rows = rows.slice().sort((a,b)=> (a.payDue||"")<(b.payDue||"")?-1:1);
  tb.innerHTML = rows.length? rows.map(r=>{
    const paid = r.status==="已平账";
    const dd = daysBetween(r.payDue);
    const badge = paid?'<span class="pill g">已付</span>':(dd<0?'<span class="pill r">逾期 '+(-dd)+'天</span>':(dd<=7?'<span class="pill a">'+dd+'天后</span>':'<span class="pill g">'+dd+'天后</span>'));
    return `<tr ${(!paid&&dd<0)?'style="background:#fff5f5"':''}>
      <td>${supName(r.supplierId)}</td><td>${money(r.invoiceAmount)}</td><td>${fmtDate(r.payDue)}</td>
      <td>${dd===null?'—':(dd<0?Math.abs(dd)+'天前':dd+'天后')}</td><td>${badge}</td><td>${r.note||"—"}</td></tr>`;
  }).join("") : `<tr><td colspan="6" class="empty">暂无记录</td></tr>`;
}

/* ---- 沟通记录 ---- */
function viewFollowup(){
  let html = `<div class="section-note">记录与供应商/门店的沟通：催货、谈票折活动、退货、催票折等。填好「下次跟进日期」，到点自动提醒你跟进。</div>`;
  html += `<div class="toolbar"><button class="btn" onclick="openForm('followup','add')">+ 新增沟通</button><div class="spacer"></div>
    <select id="fFup" onchange="filterFollowups()" style="width:160px">
      <option value="">全部</option><option value="today">待跟进(今明两天/逾期)</option><option value="done">已完成</option>
    </select></div>`;
  html += `<div class="card"><table id="fupTable"><thead><tr><th>日期</th><th>对象</th><th>事项</th><th>沟通结果</th><th>下次跟进</th><th>状态</th><th>操作</th></tr></thead><tbody>${followupRows("")}</tbody></table></div>`;
  return html;
}
function followupRows(f){
  let rows=DB.followups.slice().sort((a,b)=>(a.nextDate||a.date)<(b.nextDate||b.date)?-1:1);
  if(f==="today") rows=rows.filter(x=>{const dd=daysBetween(x.nextDate); return x.status!=="已完成" && dd!==null && dd<=1;});
  if(f==="done") rows=rows.filter(x=>x.status==="已完成");
  return rows.length? rows.map(x=>{
    const dd=daysBetween(x.nextDate);
    let pill;
    if(x.status==="已完成") pill=`<span class="pill g">已完成</span>`;
    else if(dd!==null && dd<0) pill=`<span class="pill r">逾期 ${-dd}天</span>`;
    else if(dd!==null && dd<=1) pill=`<span class="pill a">${dd<0?"今天":(dd===0?"今天":dd+"天后")}</span>`;
    else if(dd!==null) pill=`<span class="pill g">${dd}天后</span>`;
    else pill=`<span class="pill g">未定</span>`;
    return `<tr><td>${x.date||"—"}</td><td><b>${x.target||"—"}</b></td>
      <td>${x.topic||"—"}</td><td>${x.result||"—"}</td>
      <td>${x.nextDate?fmtDate(x.nextDate):"—"}</td><td>${pill}</td>
      <td class="row-actions"><button class="btn ghost mini" onclick="openForm('followup','edit','${x.id}')">编辑</button>
      <button class="btn mini" onclick="finishFollowup('${x.id}')">完成</button>
      <button class="btn danger mini" onclick="del('followup','${x.id}')">删除</button></td></tr>`;
  }).join("") : `<tr><td colspan="7" class="empty">暂无沟通记录</td></tr>`;
}
function filterFollowups(){
  const f=document.getElementById("fFup").value;
  const tb=document.querySelector("#fupTable tbody");
  if(!tb) return;
  tb.innerHTML = followupRows(f);
}
function finishFollowup(id){
  const x=DB.followups.find(v=>v.id===id); if(!x) return;
  x.status="已完成"; save(); renderNav(); filterFollowups();
}

function trackOrder(id){
  const o=DB.orders.find(x=>x.id===id); if(!o)return;
  const note=prompt("更新跟单记录（如：物流已发出 / 已签收）：",o.track||"");
  if(note===null)return;
  const st=prompt("更新订单状态（待发货/在途/已入库）：",o.status);

  o.track=note; o.status=st;
  DB.orderEdits=DB.orderEdits||{}; DB.orderEdits[o.id]={track:note,status:st};
  save(); renderNav(); showView("order");
}

    {k:"result",label:"沟通结果",full:true},
    {k:"nextDate",label:"下次跟进日期",type:"date"},{k:"status",label:"状态",type:"select",opt:["待跟进","已完成"]}
  ]}
};

function openForm(type,mode,id){
  const cfg=FORMS[type];
  const obj = mode==="edit"? DB[type][id]||{} : {};
  let html=`<h3>${mode==="edit"?"编辑":"新增"}${cfg.title}</h3><div class="form-grid">`;
  cfg.fields.forEach(f=>{
    let val = obj[f.k]!==undefined? obj[f.k] : (f.default||"");
    if(f.type==="select" && f.opt==="supplier"){
      const opts=DB.suppliers.map(s=>`<option value="${s.id}" ${val===s.id?'selected':''}>${s.name}</option>`).join("");
      html+=`<div class="${f.full?'full':''}"><label>${f.label}</label><select data-k="${f.k}">${opts}</select></div>`;
    } else if(f.type==="select"){
      const opts=f.opt.map(o=>`<option ${val===o?'selected':''}>${o}</option>`).join("");
      html+=`<div class="${f.full?'full':''}"><label>${f.label}</label><select data-k="${f.k}">${opts}</select></div>`;
    } else {
      const t=f.type==="number"?"number":(f.type==="date"?"date":"text");
      html+=`<div class="${f.full?'full':''}"><label>${f.label}</label><input data-k="${f.k}" type="${t}" value="${val}"></div>`;
    }
  });
  html+=`</div><div class="foot"><button class="btn ghost" onclick="closeModal()">取消</button>
    <button class="btn" onclick="submitForm('${type}','${mode}','${id||''}')">保存</button></div>`;
  document.getElementById("modal").innerHTML=html;
  document.getElementById("modalBg").classList.add("show");
}
function submitForm(type,mode,id){
  const cfg=FORMS[type];
  const data={};
  document.querySelectorAll("#modal [data-k]").forEach(el=>{
    let v=el.value;
    if(el.type==="number") v=parseFloat(v)||0;
    data[el.dataset.k]=v;
  });
  if(type==="recon"){
    data.diff=Math.round((data.invoiceAmount-data.receiptAmount)*100)/100;
  }
  if(mode==="edit"){
    Object.assign(DB[type][id],data);
  } else {
    data.id=uid();
    DB[type].push(data);
  }
  save(); closeModal(); renderNav(); showView(type);
}
function del(type,id){
  if(!confirm("确定删除该记录？"))return;
  DB[type]=DB[type].filter(x=>x.id!==id);
  save(); renderNav(); showView(type);
}
function closeModal(){ document.getElementById("modalBg").classList.remove("show"); }
function openModalRaw(html){ document.getElementById("modal").innerHTML=html; document.getElementById("modalBg").classList.add("show"); }
document.getElementById("modalBg").onclick=e=>{ if(e.target.id==="modalBg") closeModal(); };

  const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=name; a.click();
}

  const file=e.target.files[0]; if(!file)return;
  const r=new FileReader();

    DB.plans=data.plans||m.plans||[]; DB.returns=data.returns||m.returns||[]; DB.flows=data.flows||m.flows||[];
    DB.feedback=data.feedback||m.feedback||[]; DB.followups=data.followups||m.followups||[]; DB.menuConfig=data.menuConfig||m.menuConfig||{};
    DB.orderEdits=data.orderEdits||m.orderEdits||{};
    save(); renderNav(); showView("dash"); alert("已恢复本机手动数据"); }catch(err){ alert("文件格式错误"); } };

/* ====== Excel 同步 ====== */
function pickSheet(wb, names){ for(const n of names){ if(wb.Sheets[n]) return wb.Sheets[n]; } return null; }
let syncFull2id={}, syncShort2id={};

function refresh(){ boot(false).then(()=>alert("已刷新为最新数据")); }

function doSync(){
  const inp=document.getElementById("excelPick");
  const files=inp.files;
  if(!files||!files.length){ alert("请先选择 Excel 文件"); return; }
  const log=document.getElementById("syncLog");
  log.textContent="解析中…";
  const suppliersMap={}; // id -> supplier
  const orderPromises=[];
  const results={sup:0,ord:0,rec:0,pay:0,td:0,du:0,inb:0,files:0};

  function ensureRawSupplier(name){
    if(!name) return "";
    const id="raw_"+name;
    if(!suppliersMap[id]){
      suppliersMap[id]={id, name:name, short:name.slice(0,4), contact:"", phone:"", category:"", terms:"", logistics:"", note:""};
    }
    return id;
  }
  function syncSupId(name){
    if(!name) return "";
    if(syncFull2id[name]) return syncFull2id[name];
    // 模糊匹配（仅限较长名称，避免短词如"国药控股"误配）：名称去括号后互相包含
    const n=name.replace(/[()（）]/g,"");
    if(n.length>=5){
      for(const k in syncFull2id){
        const kk=k.replace(/[()（）]/g,"");
        if(kk.length>=5 && (kk.indexOf(n)>=0 || n.indexOf(kk)>=0)) return syncFull2id[k];
      }
    }
    return ensureRawSupplier(name);
  }
  function syncSupId2(short){ return short && syncShort2id[short] ? syncShort2id[short] : syncSupId(short); }

  function readFile(file){
    return new Promise((resolve)=>{
      const reader=new FileReader();
      reader.onload=ev=>{
        let wb;
        try{ wb=XLSX.read(ev.target.result,{type:"array"}); }
        catch(e){ resolve({file:file.name,err:"无法读取该文件（可能不是 Excel）"}); return; }
        const name=file.name;
        // 供应商清单：任何文件里的供应商清单都优先处理，立即建立映射供后续 sheet 使用
        const supSheet=pickSheet(wb,["供应商清单","供应商分类总表","供应商档案模板","供应商账期"]);
        if(supSheet){
          XLSX.utils.sheet_to_json(supSheet,{defval:""}).forEach(r=>{
            // 兼容多种列名：标准「供应商名称」/「联系人」/「电话」/「账期」；
            // 桌面票折表里的「我方供应商」(简称) + 「对应全称/说明」(全称)
            const full=String(r["供应商名称"]||r["对应全称/说明"]||"").trim();
            const short=String(r["我方供应商"]||"").trim();
            if(!full && !short) return;
            const name=full || short;
            const id="s_"+name;
            if(!suppliersMap[id]){
              suppliersMap[id]={id, name:name, short:short||name.slice(0,4), contact:String(r["联系人"]||"").trim(), phone:String(r["电话"]||"").trim(), category:"", terms:String(r["账期"]||"").trim(), logistics:String(r["常用物流"]||"").trim(), note:String(r["对接备注"]||"").trim()};
              results.sup++;
            }
          });
          syncFull2id={}; syncShort2id={};
          Object.values(suppliersMap).forEach(s=>{
            syncFull2id[s.name]=s.id; // 全称映射；short 只进 syncShort2id（避免同名短词覆盖/误配）
            syncShort2id[s.short]=s.id;
          });
        }
        // 跟单主表
        const oSheet=pickSheet(wb,["跟单主表"]);
        if(oSheet){
          XLSX.utils.sheet_to_json(oSheet,{defval:""}).forEach(r=>{
            if(!String(r["供应商名称"]||r["订单单据编号"]||r["商品名称"]||"").trim()) return;
            const sid=syncSupId(String(r["供应商名称"]||"").trim());
            const rawSt=String(r["状态"]||"").trim();
            const ostatus = (rawSt==="未到齐"||rawSt==="逾期未到"||rawSt==="在途"||rawSt==="部分到货")?"在途":(rawSt==="待发货"||rawSt==="未发货"||rawSt==="未发")?"待发货":"已入库";
            DB._sync_orders=DB._sync_orders||[];
            DB._sync_orders.push({id:"o_"+(results.ord), orderNo:String(r["订单单据编号"]||"").trim(), supplierId:sid, store:"总仓", product:String(r["商品名称"]||"").trim(), spec:String(r["商品规格"]||"").trim(), qty:String(r["订单数量"]||"").trim(), inQty:String(r["已入库数量"]||"").trim(), price:String(r["单价"]||"").trim(), amount:String(r["订单金额"]||"").trim(), inAmount:String(r["入库金额"]||"").trim(), orderDate:excelDateToISO(r["下单日期"]), expectDate:excelDateToISO(r["预计到达日期"]), status:ostatus, track:String(r["跟单备注"]||"").trim(), invoiceNo:String(r["发票号"]||"").trim()});
            results.ord++;
          });
        }
        // 采购入库表（如「采购入库表8月.xlsx」）：按表头识别，入库金额最准
        const inbSheet=(function(){ // 找表头含 供应商名称+含税金额 的 sheet
          for(const sn of wb.SheetNames){
            const r0=XLSX.utils.sheet_to_json(wb.Sheets[sn],{header:1,defval:""})[0]||[];
            const h=r0.map(c=>String(c).trim());
            if(h.indexOf("供应商名称")>=0 && h.indexOf("含税金额")>=0 && h.indexOf("日期")>=0) return wb.Sheets[sn];
          }
          return null;
        })();
        if(inbSheet){
          XLSX.utils.sheet_to_json(inbSheet,{defval:""}).forEach(r=>{
            if(!String(r["供应商名称"]||r["含税金额"]||"").trim()) return;
            const sid=syncSupId(String(r["供应商名称"]||"").trim());
            DB._sync_inbound=DB._sync_inbound||[];
            DB._sync_inbound.push({id:"in_"+(results.inb), date:excelDateToISO(r["日期"]), supplierId:sid, supplierName:String(r["供应商名称"]||"").trim(), docNo:String(r["单据编号"]||"").trim(), taxAmount:String(r["含税金额"]||"").trim(), amount:String(r["金额"]||"").trim(), tax:String(r["税额"]||"").trim(), orderNo:String(r["原订单编号"]||"").trim(), orderDate:excelDateToISO(r["原订单日期"]), b2c:String(r["是否b2c需求"]||"").trim(), note:String(r["备注"]||"").trim()});
            results.inb++;
          });
        }
        // 发票登记与付款
        const iSheet=pickSheet(wb,["发票登记与付款"]);
        if(iSheet){
          XLSX.utils.sheet_to_json(iSheet,{defval:""}).forEach(r=>{
            if(!String(r["供应商名称"]||r["发票金额(价税合计)"]||r["发票号码"]||"").trim()) return;
            const sid=syncSupId(String(r["供应商名称"]||"").trim());
            const invAmt=String(r["发票金额(价税合计)"]||"").trim();
            const paid=String(r["是否付款"]||"").trim();
            const paidFlag=paid==="是"?"已付":"未付";
            DB._sync_recon=DB._sync_recon||[];
            const invDate=excelDateToISO(r["开票日期"]);
            DB._sync_recon.push({id:"r_"+(results.rec), supplierId:sid, month:(invDate||"").slice(0,7), invoiceAmount:invAmt, receiptAmount:invAmt, diff:0, status:paidFlag==="已付"?"已平账":"差异处理中", invoiceNo:String(r["发票号码"]||"").trim(), payDue:excelDateToISO(r["付款到期日"]), note:String(r["备注"]||"").trim()});
            results.rec++;
            if(paidFlag==="已付"){ DB._sync_payments=DB._sync_payments||[]; DB._sync_payments.push({id:"p_"+(results.pay), supplierId:sid, amount:invAmt, payDate:excelDateToISO(r["实际付款日期"])||invDate, method:"电汇", reconId:"", note:"发票"+String(r["发票号码"]||"")}); results.pay++; }
          });
        }
        // 票折收回与抵扣明细（兼容用户文件里的「票折明细」）
        const tSheet=pickSheet(wb,["票折收回与抵扣明细","票折明细"]);
        if(tSheet){
          let lastParty="";
          XLSX.utils.sheet_to_json(tSheet,{defval:""}).forEach(r=>{
            const party=String(r["票折方"]||"").trim()||lastParty;
            if(!party && !String(r["票折品种"]||r["品种"]||"").trim() && !String(r["金额"]||"").trim()) return;
            lastParty=party;
            const sid=syncSupId2(String(r["我方供应商"]||party||"").trim());
            DB._sync_td=DB._sync_td||[];
            DB._sync_td.push({id:"td_"+(results.td), date:excelDateToISO(r["日期"]), party:party, supplierId:sid, prodCode:String(r["品种编码"]||r["编码.1"]||r["编码_1"]||"").trim(), product:String(r["票折品种"]||r["品种"]||"").trim(), upstream:String(r["上游厂家"]||"").trim(), amount:String(r["金额"]||"").trim(), method:String(r["票折方式"]||"").trim(), redNo:String(r["红字信息表号"]||"").trim(), deductNo:String(r["抵扣发票号/负票号"]||"").trim(), verify:String(r["核销情况"]||"").trim(), note:String(r["备注"]||"").trim()});
            results.td++;
          });
        }
        // 票折催收 / 初步录入（用户截图里的格式）
        const dSheet=pickSheet(wb,["票折催收初步录入","票折初步录入"]);
        if(dSheet){
          XLSX.utils.sheet_to_json(dSheet,{defval:""}).forEach(r=>{
            if(!String(r["供应商"]||r["票折方"]||r["应开票折金额(预估)"]||r["应收金额"]||r["金额"]||"").trim()) return;
            const sid=syncSupId2(String(r["供应商"]||r["票折方"]||"").trim());
            const estV=String(r["应开票折金额(预估)"]||r["应收金额"]||r["应开票折"]||r["金额"]||"").trim();
            const owedV=String(r["尚欠金额"]||r["未收金额"]||r["待收金额"]||"").trim()||estV;
            DB._sync_du=DB._sync_du||[];
            DB._sync_du.push({id:"du_"+(results.du), seq:String(r["序号"]||"").trim(), supplierId:sid, prodCode:String(r["商品编码"]||r["编码.1"]||r["编码_1"]||r["品种编码"]||"").trim(), product:String(r["品种/商品名称"]||r["票折品种"]||r["品种"]||"").trim(), est:estV, received:String(r["已收回金额"]||"").trim(), owed:owedV, firstDate:excelDateToISO(r["首次催收日期"]), lastDate:excelDateToISO(r["最近催收日期"]), count:String(r["催收次数"]||"").trim(), reply:String(r["供应商回复/承诺"]||"").trim(), status:String(r["状态"]||"").trim(), nextDate:excelDateToISO(r["下次跟进日期"]), rep:String(r["业务员"]||"").trim(), note:String(r["备注"]||"").trim()});
            results.du++;
          });
        }
        // 说明：票折催收只统计「票折催收初步录入」sheet 的记录（用户要求）
        results.files++;
        resolve({file:name});
      };
      reader.readAsArrayBuffer(file);
    });
  }

  Promise.all(Array.from(files).map(readFile)).then(res=>{
    // 建立供应商索引（short 只进 syncShort2id，避免同名短词覆盖/误配）
    syncFull2id={}; syncShort2id={};
    Object.values(suppliersMap).forEach(s=>{ syncFull2id[s.name]=s.id; syncShort2id[s.short]=s.id; });
    // 二次遍历：用票折表简称补全 short / 账期
    Object.values(suppliersMap).forEach(s=>{
      // 已在收集阶段建立，无需再处理
    });
    // 归入 DB（供应商只保留清单里的正式供应商，raw_ 临时供应商不进入列表）
    if(results.sup){ DB.suppliers=Object.values(suppliersMap).filter(s=>!String(s.id).startsWith("raw_")); }
    if(DB._sync_orders){ DB.orders=DB._sync_orders; }
    if(DB._sync_recon){ DB.recon=DB._sync_recon; }
    if(DB._sync_payments){ DB.payments=DB._sync_payments; }
    if(DB._sync_td){ DB.ticketDetail=DB._sync_td; }
    if(DB._sync_du){ DB.ticketDunning=DB._sync_du; }
    if(DB._sync_inbound){ DB.inbound=DB._sync_inbound; }
    delete DB._sync_orders; delete DB._sync_recon; delete DB._sync_payments; delete DB._sync_td; delete DB._sync_du; delete DB._sync_inbound;
    save();
    renderNav(); showView("dash");
    log.innerHTML=`✅ 同步完成：导入 ${results.files} 个文件 → 供应商 ${results.sup}、订单 ${results.ord}、对账 ${results.rec}、付款 ${results.pay}、票折明细 ${results.td}、催收 ${results.du}、入库 ${results.inb}`;
    setTimeout(()=>closeModal(), 900);
  });
}
